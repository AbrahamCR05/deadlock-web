<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Logo de Deadlock Web" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Anillo exterior e interior -->
    <circle cx="128" cy="128" r="110" fill="none" stroke="#2dd4bf" stroke-width="8"/>
    <circle cx="128" cy="128" r="84" fill="none" stroke="#0f766e" stroke-width="3"/>

    <!-- 8 rayos hacia el centro -->
    <g stroke="#2dd4bf" stroke-width="5" stroke-linecap="round">
      <line x1="128" y1="44" x2="128" y2="92"/>
      <line x1="128" y1="44" x2="128" y2="92" transform="rotate(45 128 128)"/>
      <line x1="128" y1="44" x2="128" y2="92" transform="rotate(90 128 128)"/>
      <line x1="128" y1="44" x2="128" y2="92" transform="rotate(135 128 128)"/>
      <line x1="128" y1="44" x2="128" y2="92" transform="rotate(180 128 128)"/>
      <line x1="128" y1="44" x2="128" y2="92" transform="rotate(225 128 128)"/>
      <line x1="128" y1="44" x2="128" y2="92" transform="rotate(270 128 128)"/>
      <line x1="128" y1="44" x2="128" y2="92" transform="rotate(315 128 128)"/>
    </g>

    <!-- Centro con cerradura -->
    <circle cx="128" cy="128" r="36" fill="#0f172a" stroke="#2dd4bf" stroke-width="5"/>
    <circle cx="128" cy="121" r="9" fill="#2dd4bf"/>
    <path d="M122 127 L134 127 L138 148 L118 148 Z" fill="#2dd4bf"/>
  </g>
</svg>
